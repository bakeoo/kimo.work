<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı — Kimo</title>
<meta name="description" content="Aradığınız sayfa Kimo sitesinde bulunamadı.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="./favicon.ico?v=3" sizes="48x48">
<link rel="icon" href="./favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="./favicon-32.png?v=3" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=3">
<link rel="manifest" href="./site.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170D14" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<style>
  :root{
    --paper:#FFFFFF; --card:#F3F3F5; --sunken:#F3F3F5; --line:#ECECEF; --shadow:#E2E2E7;
    --ink:#1B1A1F; --ink2:#6B6A73; --ink3:#6B6A73;
    --coral:#C8174A; --coral-deep:#8E0E33; --coral-ink:#B8163F; --coral-soft:#FCEBF0; --coral-ink2:#6B6A73;
    --photo:#F3F3F5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#170D14; --card:#241620; --sunken:#241620; --line:#33212D; --shadow:#0B0609;
      --ink:#FBEFF3; --ink2:#B79AA8; --ink3:#B79AA8;
      --coral:#E8285F; --coral-deep:#9C1240; --coral-ink:#F0607F; --coral-soft:#3A1627; --coral-ink2:#B79AA8;
      --photo:#241620;
    }
  }
  body{ margin:0; background:var(--paper,#FFFFFF); color:var(--ink,#1B1A1F); font-family:'Nunito',system-ui,sans-serif;font-weight:500; -webkit-font-smoothing:antialiased; }
  a{ color:var(--coral-ink,#B8163F); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  *{ box-sizing:border-box; }
</style>
</head>
<body>
<main style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 24px;text-align:center">
  <div style="width:150px;height:150px;border-radius:75px;background:var(--coral-soft,#FCEBF0);display:flex;align-items:center;justify-content:center">
    <img src="./logo-rozet.svg" width="108" height="106" alt="">
  </div>
  <h1 style="margin:0;font-family:'Nunito',sans-serif;font-size:clamp(28px,5vw,40px);font-weight:900;line-height:1.1">Bu sayfayı bulamadık</h1>
  <p style="margin:0;font-size:17px;line-height:1.65;color:var(--ink2,#6B6A73);max-width:44ch">Adres yanlış yazılmış ya da sayfa taşınmış olabilir.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <a href="./index.html" style="min-height:44px;display:flex;align-items:center;padding:0 20px;font-size:16px;font-weight:800;background:var(--coral,#C8174A);border-radius:14px;box-shadow:0 4px 0 var(--coral-deep,#8E0E33);color:#FFFFFF;text-decoration:none">Ana sayfa</a>
    <a href="./iletisim.html" style="min-height:44px;display:flex;align-items:center;padding:0 16px;font-size:15px;font-weight:500;color:var(--ink2,#6B6A73)">İletişim</a>
    <a href="./hesap-silme.html" style="min-height:44px;display:flex;align-items:center;padding:0 16px;font-size:15px;font-weight:500;color:var(--ink2,#6B6A73)">Hesap silme</a>
  </div>
</main>
</body>
</html>
